services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: contextcrew
      POSTGRES_USER: contextcrew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextcrew -d contextcrew"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
