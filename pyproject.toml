[project]
name = "contextcrew"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.14"]

[tool.uv.workspace]
members = ["apps/api", "packages/bridge"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "tests/integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
